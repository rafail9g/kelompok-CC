events {}
http {
  # Resolver Docker: re-resolve tiap 5 detik supaya replika baru (scale) ikut kebagian trafik
  resolver 127.0.0.11 valid=5s;

  server {
    listen 80;

    # /metrics tidak dibuka ke publik
    location /metrics { return 403; }

    location / {
      set $backend http://app:3000;
      proxy_pass $backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
